name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang, tcc]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y tcc

      - name: Build and run tests (${{ matrix.compiler }})
        run: |
          make clean
          make test CC=${{ matrix.compiler }}
        timeout-minutes: 10

      - name: Verify static archive exists
        run: test -f lib/libttak.a

  zero-alloc-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run zero-allocation static-init test (-DTTAK_NO_MALLOC)
        run: |
          make clean
          make zero-alloc-test CC=gcc
        timeout-minutes: 5

      - name: Build and run zero-allocation static-init test with tcc
        run: |
          sudo apt-get update
          sudo apt-get install -y tcc
          make zero-alloc-test CC=tcc
        timeout-minutes: 5

name: Bare-metal (Cortex-M)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: cortex-m0plus
            mcu: -mcpu=cortex-m0plus -mthumb -mfloat-abi=soft
          - core: cortex-m3
            mcu: -mcpu=cortex-m3 -mthumb -mfloat-abi=soft
          - core: cortex-m4f
            mcu: -mcpu=cortex-m4 -mthumb -mfloat-abi=hard -mfpu=fpv4-sp-d16
          - core: cortex-m33
            mcu: -mcpu=cortex-m33 -mthumb -mfloat-abi=hard -mfpu=fpv5-sp-d16
          - core: cortex-m7
            mcu: -mcpu=cortex-m7 -mthumb -mfloat-abi=hard -mfpu=fpv5-d16
    name: build (${{ matrix.core }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Build libttak.a
        run: make PLATFORM=baremetal MCU_FLAGS="${{ matrix.mcu }}"

      - name: Verify static archive exists
        run: test -f lib/libttak.a

      - name: Check stack usage (-fstack-usage)
        run: python3 scripts/baremetal/check_stack_usage.py --core "${{ matrix.core }}"

      - name: Upload stack-usage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack-usage-${{ matrix.core }}
          path: obj/**/*.su
          if-no-files-found: error

  qemu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: unit tests (QEMU mps2-an500, Cortex-M7)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm

      - name: Build test images
        run: make PLATFORM=baremetal BOARD=mps2_an500 baremetal-tests

      - name: Run tests
        run: scripts/baremetal/run_qemu.sh tests/baremetal/build/mps2_an500/*.elf
        timeout-minutes: 15

  freertos-qemu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: unit tests on FreeRTOS (QEMU mps2-an500, Cortex-M7)
    env:
      FREERTOS_TAG: V11.1.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm

      - name: Fetch FreeRTOS-Kernel
        run: git clone --depth 1 --branch "$FREERTOS_TAG" https://github.com/FreeRTOS/FreeRTOS-Kernel "$RUNNER_TEMP/FreeRTOS-Kernel"

      - name: Build test images
        run: make PLATFORM=freertos FREERTOS_KERNEL_PATH="$RUNNER_TEMP/FreeRTOS-Kernel" BOARD=mps2_an500 baremetal-tests

      - name: Run tests
        run: scripts/baremetal/run_qemu.sh tests/baremetal/build/mps2_an500-freertos/*.elf
        timeout-minutes: 15

  lwip-qemu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: unit tests on FreeRTOS + lwIP (QEMU mps2-an500, Cortex-M7)
    env:
      FREERTOS_TAG: V11.1.0
      LWIP_TAG: STABLE-2_2_1_RELEASE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm

      - name: Fetch FreeRTOS-Kernel and lwIP
        run: |
          git clone --depth 1 --branch "$FREERTOS_TAG" https://github.com/FreeRTOS/FreeRTOS-Kernel "$RUNNER_TEMP/FreeRTOS-Kernel"
          git clone --depth 1 --branch "$LWIP_TAG" https://github.com/lwip-tcpip/lwip "$RUNNER_TEMP/lwip"

      - name: Build test images
        run: make PLATFORM=freertos NET=lwip FREERTOS_KERNEL_PATH="$RUNNER_TEMP/FreeRTOS-Kernel" LWIP_PATH="$RUNNER_TEMP/lwip" BOARD=mps2_an500 baremetal-tests

      - name: Run tests
        run: scripts/baremetal/run_qemu.sh tests/baremetal/build/mps2_an500-freertos-lwip/*.elf
        timeout-minutes: 15

  stm32f769i-disco-ethernet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: build STM32F769I-DISCO Ethernet example
    env:
      FREERTOS_TAG: V11.1.0
      LWIP_TAG: STABLE-2_2_1_RELEASE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi rsync

      - name: Fetch FreeRTOS, lwIP and the ST drivers
        run: |
          cd "$RUNNER_TEMP"
          git clone --depth 1 --branch "$FREERTOS_TAG" https://github.com/FreeRTOS/FreeRTOS-Kernel
          git clone --depth 1 --branch "$LWIP_TAG" https://github.com/lwip-tcpip/lwip
          for repo in stm32f7xx-hal-driver cmsis-device-f7 cmsis-core stm32-lan8742; do
            git clone --depth 1 "https://github.com/STMicroelectronics/$repo"
          done

      - name: Build the example
        run: |
          make -C examples/stm32f769i-disco-lwip \
            FREERTOS_KERNEL_PATH="$RUNNER_TEMP/FreeRTOS-Kernel" LWIP_PATH="$RUNNER_TEMP/lwip" \
            STM32_HAL_PATH="$RUNNER_TEMP/stm32f7xx-hal-driver" \
            STM32_CMSIS_DEVICE_PATH="$RUNNER_TEMP/cmsis-device-f7" \
            CMSIS_CORE_PATH="$RUNNER_TEMP/cmsis-core" LAN8742_PATH="$RUNNER_TEMP/stm32-lan8742"
